<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NewTab.Ai</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #07080f;
    --bg-deep: #030308;
    --panel: rgba(255,255,255,0.035);
    --panel-strong: rgba(255,255,255,0.055);
    --line: rgba(255,120,190,0.14);
    --line-soft: rgba(255,255,255,0.07);

    --ink: #f3eef8;
    --ink-soft: #a79bc4;
    --ink-faint: #605a7c;

    --pink: #ff3fa0;
    --pink-soft: #ff8fc9;
    --pink-dim: #5c2148;
    --pink-glow: rgba(255,63,160,0.28);

    --blue: #5271ff;
    --blue-soft: #9fb0ff;
    --blue-dim: #1c2454;
    --blue-glow: rgba(82,113,255,0.26);

    --danger: #ff6b7d;
    --danger-bg: #23121a;
    --danger-line: #4a2233;

    --radius: 14px;
    --font-display: 'Unbounded', sans-serif;
    --font-body: 'Plus Jakarta Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{ box-sizing: border-box; }

  html, body{ height: 100%; }

  body{
    margin: 0;
    min-height: 100vh;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  /* ---------- ambient backdrop: interactive dot grid + drifting glow ---------- */
  #dotCanvas{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
  }

  .glow{
    position: fixed;
    width: 620px;
    height: 620px;
    border-radius: 50%;
    filter: blur(110px);
    z-index: 0;
    pointer-events: none;
    opacity: 0.55;
  }
  .glow.pink{
    top: -180px;
    left: -160px;
    background: var(--pink-glow);
    animation: driftA 22s ease-in-out infinite;
  }
  .glow.blue{
    bottom: -200px;
    right: -160px;
    background: var(--blue-glow);
    animation: driftB 26s ease-in-out infinite;
  }

  @keyframes driftA{
    0%, 100%{ transform: translate(0,0); }
    50%{ transform: translate(60px, 40px); }
  }
  @keyframes driftB{
    0%, 100%{ transform: translate(0,0); }
    50%{ transform: translate(-50px, -30px); }
  }

  /* ---------- shell ---------- */
  .console{
    width: 100%;
    max-width: 640px;
    height: 88vh;
    max-height: 840px;
    background: linear-gradient(180deg, rgba(18,14,28,0.92), rgba(8,7,16,0.94));
    backdrop-filter: blur(18px);
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--line-soft);
    box-shadow:
      0 50px 100px -30px rgba(0,0,0,0.75),
      0 0 0 1px rgba(255,63,160,0.05) inset;
    position: relative;
    z-index: 1;
  }

  .console::before{
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--pink), var(--blue), transparent);
    opacity: 0.6;
  }

  /* ---------- header ---------- */
  .header{
    padding: 20px 22px 16px 22px;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .header-top{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .brand h1{
    margin: 0;
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink);
    background: linear-gradient(100deg, var(--pink-soft), var(--blue-soft) 70%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ---------- model badge ---------- */
  .model-row{
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .model-badge{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 13px 7px 11px;
    border-radius: 100px;
    background: linear-gradient(135deg, rgba(255,63,160,0.10), rgba(82,113,255,0.10));
    border: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .model-badge .dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 0 3px rgba(74,222,128,0.18);
    flex-shrink: 0;
  }

  .model-badge .name{
    color: var(--ink);
    font-weight: 600;
  }

  /* ---------- feed ---------- */
  #feed{
    flex: 1;
    padding: 20px 20px 6px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #feed::-webkit-scrollbar{ width: 7px; }
  #feed::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 8px; }

  .empty-state{
    margin: auto;
    text-align: center;
    color: var(--ink-faint);
    max-width: 280px;
  }

  .empty-state .glyph{
    width: 34px;
    height: 34px;
    margin: 0 auto 14px auto;
    border-radius: 10px;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--pink-dim), var(--blue-dim));
  }

  .empty-state .glyph span{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--pink-soft);
    display: inline-block;
    margin: 0 2px;
  }

  .empty-state p{
    font-size: 13.5px;
    line-height: 1.6;
    margin: 0;
    color: var(--ink-soft);
  }

  /* entries: full-width transmission-log rows, not chat bubbles */
  .entry{
    display: flex;
    gap: 12px;
    max-width: 100%;
  }

  .rail{
    width: 3px;
    border-radius: 3px;
    flex-shrink: 0;
    margin-top: 2px;
    background: var(--pink);
    opacity: 0.85;
  }

  .entry.ai .rail{ background: var(--blue); }

  .entry-body{
    flex: 1;
    min-width: 0;
  }

  .entry-meta{
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .entry.user .entry-meta .who{ color: var(--pink-soft); }
  .entry.ai .entry-meta .who{ color: var(--blue-soft); }

  .entry-meta .sep{ color: var(--ink-faint); }
  .entry-meta .time{ color: var(--ink-faint); }

  .entry-text{
    font-size: 14.5px;
    line-height: 1.62;
    color: var(--ink);
    white-space: pre-wrap;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
  }

  .entry.user .entry-text{
    background: linear-gradient(160deg, rgba(255,63,160,0.09), rgba(255,63,160,0.02));
    border-color: rgba(255,63,160,0.18);
  }

  .entry.ai .entry-text{
    background: linear-gradient(160deg, rgba(82,113,255,0.09), rgba(82,113,255,0.02));
    border-color: rgba(82,113,255,0.18);
  }

  /* ---------- loading / thinking indicator ---------- */
  .loader-card{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    width: fit-content;
  }

  .loader-dots{
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .loader-dots span{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--pink), var(--blue));
    animation: orbit-pulse 1.1s ease-in-out infinite;
  }

  .loader-dots span:nth-child(2){ animation-delay: 0.15s; }
  .loader-dots span:nth-child(3){ animation-delay: 0.3s; }

  @keyframes orbit-pulse{
    0%, 80%, 100%{ transform: scale(0.6); opacity: 0.35; }
    40%{ transform: scale(1.15); opacity: 1; }
  }

  .loader-label{
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* ---------- composer ---------- */
  .input-area{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 18px;
    border-top: 1px solid var(--line-soft);
    background: rgba(255,255,255,0.02);
  }

  input#input{
    flex: 1;
    padding: 13px 16px;
    border: 1px solid var(--line-soft);
    border-radius: 12px;
    font-size: 14.5px;
    font-family: var(--font-body);
    background: rgba(255,255,255,0.035);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  input#input::placeholder{ color: var(--ink-faint); }

  input#input:focus{
    border-color: var(--pink);
    background: rgba(255,63,160,0.05);
  }

  input#input:disabled{
    opacity: 0.55;
    cursor: not-allowed;
  }

  .send-btn{
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--pink), var(--blue));
    color: #0a0714;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease, filter 0.15s ease;
  }

  .send-btn svg{ width: 18px; height: 18px; }

  .send-btn:hover:not(:disabled){ filter: brightness(1.1); }
  .send-btn:active:not(:disabled){ transform: scale(0.94); }

  .send-btn:disabled{
    opacity: 0.45;
    cursor: not-allowed;
    filter: none;
  }

  button:focus-visible, input:focus-visible, select:focus-visible{
    outline: 2px solid var(--pink);
    outline-offset: 2px;
  }

  /* ---------- toast ---------- */
  .toast-layer{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 20px;
    pointer-events: none;
    z-index: 5;
  }

  .toast{
    pointer-events: auto;
    max-width: 92%;
    background: var(--danger-bg);
    border: 1px solid var(--danger-line);
    color: #ffd2da;
    padding: 14px 16px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.45;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.7);
    animation: rise 0.25s ease;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .toast .icon{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    color: var(--danger);
    flex-shrink: 0;
  }

  .toast button.close{
    all: unset;
    cursor: pointer;
    color: var(--danger);
    font-family: var(--font-mono);
    font-size: 12px;
    margin-left: auto;
    padding: 2px 6px;
    flex-shrink: 0;
  }

  @media (max-width: 480px){
    body{ padding: 10px; }
    .console{ height: 94vh; border-radius: 18px; }
    .glow{ width: 380px; height: 380px; filter: blur(80px); }
  }

  @media (prefers-reduced-motion: reduce){
    .toast{ animation: none; }
    .loader-dots span{ animation: none; opacity: 1; transform: scale(1); }
    .glow{ animation: none; }
  }
</style>
</head>

<body>

<canvas id="dotCanvas"></canvas>
<div class="glow pink"></div>
<div class="glow blue"></div>

<div class="console">

  <div class="header">
    <div class="header-top">
      <div class="brand">
        <h1>NewTab.Ai</h1>
      </div>
    </div>

    <div class="model-row">
      <div class="model-badge">
        <span class="dot"></span>
        <span class="name">Nemotron 3 Nano Omni</span>
      </div>
    </div>
  </div>

  <div id="feed">
    <div class="empty-state" id="emptyState">
      <div class="glyph"><span></span><span></span></div>
      <p>Ask anything.</p>
    </div>
  </div>

  <div class="input-area">
    <input
      id="input"
      type="text"
      placeholder="Type a message…"
      onkeydown="if(event.key === 'Enter') sendMessage()"
    >
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="toast-layer" id="toastLayer"></div>

</div>

<script>
  // ---------- interactive dot-grid backdrop ----------
  (function initDotGrid(){
    const canvas = document.getElementById("dotCanvas");
    const ctx = canvas.getContext("2d");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const SPACING = 26;
    const BASE_RADIUS = 1.3;
    const MAX_RADIUS = 4.2;
    const INFLUENCE = 150;
    const PUSH = 14;

    const pink = [255, 63, 160];
    const blue = [82, 113, 255];

    let dots = [];
    let mouse = { x: -9999, y: -9999 };
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let width = 0, height = 0;

    function resize(){
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildGrid();
    }

    function buildGrid(){
      dots = [];
      const cols = Math.ceil(width / SPACING) + 1;
      const rows = Math.ceil(height / SPACING) + 1;
      for (let i = 0; i < cols; i++){
        for (let j = 0; j < rows; j++){
          const x = i * SPACING;
          const y = j * SPACING;
          const t = Math.min(1, Math.max(0, (x / width + y / height) / 2));
          dots.push({ x, y, t });
        }
      }
    }

    function draw(){
      ctx.clearRect(0, 0, width, height);

      for (let k = 0; k < dots.length; k++){
        const d = dots[k];
        const dx = d.x - mouse.x;
        const dy = d.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        let radius = BASE_RADIUS;
        let drawX = d.x;
        let drawY = d.y;
        let alpha = 0.16 + d.t * 0.06;

        if (dist < INFLUENCE) {
          const factor = 1 - dist / INFLUENCE;
          radius = BASE_RADIUS + factor * (MAX_RADIUS - BASE_RADIUS);
          const angle = Math.atan2(dy, dx);
          drawX = d.x + Math.cos(angle) * factor * PUSH;
          drawY = d.y + Math.sin(angle) * factor * PUSH;
          alpha = Math.min(1, alpha + factor * 0.7);
        }

        const r = pink[0] + (blue[0] - pink[0]) * d.t;
        const g = pink[1] + (blue[1] - pink[1]) * d.t;
        const b = pink[2] + (blue[2] - pink[2]) * d.t;

        ctx.beginPath();
        ctx.fillStyle = `rgba(${r | 0}, ${g | 0}, ${b | 0}, ${alpha})`;
        ctx.arc(drawX, drawY, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      if (!reduceMotion) requestAnimationFrame(draw);
    }

    window.addEventListener("resize", resize);
    window.addEventListener("mousemove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener("mouseleave", () => {
      mouse.x = -9999;
      mouse.y = -9999;
    });
    window.addEventListener("touchmove", (e) => {
      if (e.touches && e.touches[0]) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    }, { passive: true });

    resize();
    draw();
  })();

  const API_KEY = "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";

  // Fixed model — OpenRouter's free (":free") Nemotron 3 Nano Omni endpoint.
  const MODEL_ID = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free";
  const MODEL_LABEL = "Nemotron 3 Nano Omni";

  const messages = [];
  let isSending = false; // true while waiting on a response — blocks sending another message

  function setComposerDisabled(disabled){
    document.getElementById("input").disabled = disabled;
    document.getElementById("sendBtn").disabled = disabled;
  }

  function currentModel(){
    return MODEL_ID;
  }

  function currentModelLabel(){
    return MODEL_LABEL;
  }

  function showToast(text){
    const layer = document.getElementById("toastLayer");
    layer.innerHTML = "";

    const toast = document.createElement("div");
    toast.className = "toast";
    toast.innerHTML = `
      <span class="icon">!</span>
      <span>${text}</span>
      <button class="close" aria-label="Dismiss">✕</button>
    `;
    toast.querySelector(".close").onclick = () => toast.remove();

    layer.appendChild(toast);

    setTimeout(() => toast.remove(), 8000);
  }

  function timeNow(){
    const d = new Date();
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  async function sendMessage() {
    if (isSending) return; // cooldown: block until the in-flight message has finished loading

    const input = document.getElementById("input");
    const text = input.value.trim();

    if (!text) return;

    const model = currentModel();

    isSending = true;
    setComposerDisabled(true);

    document.getElementById("emptyState")?.remove();

    input.value = "";

    addMessage(text, "user");

    messages.push({
      role: "user",
      content: text
    });

    const thinkingRow = addLoadingEntry();

    try {
      const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: model,
          messages: messages
        })
      });

      const data = await response.json();

      thinkingRow.remove();

      if (!response.ok) {
        throw new Error(data.error?.message || "API request failed");
      }

      const reply = data.choices[0].message.content;

      addMessage(reply, "ai");

      messages.push({
        role: "assistant",
        content: reply
      });

    } catch (error) {
      thinkingRow.remove();
      showToast(`Request failed: ${error.message || "unknown error"}`);
      console.error(error);
    } finally {
      isSending = false;
      setComposerDisabled(false);
      input.focus();
    }
  }

  function addMessage(text, type) {
    const feed = document.getElementById("feed");

    const entry = document.createElement("div");
    entry.className = "entry " + type;

    const rail = document.createElement("div");
    rail.className = "rail";

    const body = document.createElement("div");
    body.className = "entry-body";

    const meta = document.createElement("div");
    meta.className = "entry-meta";
    const who = type === "user" ? "You" : currentModelLabel();
    meta.innerHTML = `<span class="who">${who}</span><span class="sep">·</span><span class="time">${timeNow()}</span>`;

    const bubble = document.createElement("div");
    bubble.className = "entry-text";
    bubble.textContent = text;

    body.appendChild(meta);
    body.appendChild(bubble);
    entry.appendChild(rail);
    entry.appendChild(body);

    feed.appendChild(entry);
    feed.scrollTop = feed.scrollHeight;

    return entry;
  }

  function addLoadingEntry() {
    const feed = document.getElementById("feed");

    const entry = document.createElement("div");
    entry.className = "entry ai";

    const rail = document.createElement("div");
    rail.className = "rail";

    const body = document.createElement("div");
    body.className = "entry-body";

    const meta = document.createElement("div");
    meta.className = "entry-meta";
    meta.innerHTML = `<span class="who">${currentModelLabel()}</span><span class="sep">·</span><span class="time">${timeNow()}</span>`;

    const loader = document.createElement("div");
    loader.className = "loader-card";
    loader.innerHTML = `
      <div class="loader-dots"><span></span><span></span><span></span></div>
      <div class="loader-label">Thinking…</div>
    `;

    body.appendChild(meta);
    body.appendChild(loader);
    entry.appendChild(rail);
    entry.appendChild(body);

    feed.appendChild(entry);
    feed.scrollTop = feed.scrollHeight;

    return entry;
  }

  // ---------- init ----------
  document.getElementById("input")?.focus();
</script>

</body>
</html>
